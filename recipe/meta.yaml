{% set name = "nbformat" %}
{% set version = "5.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/nbformat-{{ version }}.tar.gz
  sha256: 7dbaed4a69cae28c2b4d44ab7430a6af4544fb89455023f6f21550be757b60c8

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - jupyter-trust = nbformat.sign:TrustNotebookApp.launch_instance
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.5
    - hatch-nodejs-version
  run:
    - python
    - jsonschema >=2.6
    - jupyter_core >=4.12,!=5.0.*
    - python-fastjsonschema >=2.15
    - traitlets >=5.1

test:
  source_files:
    - tests
  imports:
    - nbformat
  requires:
    - pip
    - pytest
    - testpath
  commands:
    - pip check
    - jupyter trust --version
    - jupyter-trust --help
    # pep440 is required for passing tests/test_api.py
    - pip install pep440
    - pytest -vv

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The Jupyter Notebook format
  description: |
    This package contains the base implementation of the Jupyter Notebook format,
    and Python APIs for working with notebooks.
  doc_url: https://nbformat.readthedocs.io
  dev_url: https://github.com/jupyter/nbformat

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
    - pelson
    - takluyver
    - ocefpaf
    - mpacer
